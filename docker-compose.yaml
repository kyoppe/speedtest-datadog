version: '3.8'

services:
  speedtest:
    # build: .
    # Use pre-built image from GitHub Container Registry:
    image: ghcr.io/kyoppe/speedtest-datadog:latest
    
    container_name: speedtest-datadog
    
    environment:
      # Secrets (from .env file)
      - DD_API_KEY=${DD_API_KEY}
      
      # Host and container information (from .env file)
      # HOST_HOSTNAME: Set to actual hostname in .env file
      - HOST_HOSTNAME=${HOST_HOSTNAME:-}
      - CONTAINER_NAME=speedtest-datadog
      
      # Configuration (edit these values directly)
      - DD_SITE=datadoghq.com
      - METRIC_PREFIX=test.kyouhei
      - DD_TAGS=datacenter:machida
      - SPEEDTEST_SERVER_ID=7139  # Comment in to use auto server selection(7139 is Tsukuba)
      - SPEEDTEST_FREQUENCY=120
      - ENABLE_LOGS=true
      - ENABLE_TRACES=true
    
    restart: unless-stopped

  # Uncomment to enable full observability (logs + traces)
